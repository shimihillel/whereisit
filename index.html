<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>איפה זה?! — UI Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="phone-shell">
    <header class="top">
      <button class="icon-btn" aria-label="התראות">
        <svg viewBox="0 0 24 24"><path d="M12 4.5a4.5 4.5 0 0 0-4.5 4.5v1.1c0 .8-.23 1.58-.67 2.25L5.4 14.5h13.2l-1.43-2.15a4.1 4.1 0 0 1-.67-2.25V9A4.5 4.5 0 0 0 12 4.5Z"/><path d="M9.8 18.25a2.25 2.25 0 0 0 4.4 0"/></svg>
      </button>

      <h1><span>איפה זה</span><span class="accent">?!</span></h1>

      <button class="icon-btn" aria-label="חבילה">
        <svg viewBox="0 0 24 24"><path d="M12 3.2 4.9 6.4v11.2l7.1 3.2 7.1-3.2V6.4L12 3.2Z"/><path d="M4.9 6.4 12 9.7l7.1-3.3"/><path d="M12 9.7v11.1"/><path d="M8.4 4.8 15.5 8"/></svg>
      </button>
    </header>

    <section class="summary">
      <div class="summary-text">
        <div class="eyebrow">בדרך עכשיו</div>
        <div class="big-number">1 חבילות · ₪55</div>
        <p>עוד רגע זה אצלך.</p>
      </div>

      <div class="summary-icon">
        <img src="icon-192.png" alt="" />
      </div>
    </section>

    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4 4"/></svg>
      <input placeholder="חפשי חנות, פריט או מספר הזמנה..." />
    </label>

    <section class="section-head">
      <div class="title-row">
        <span class="badge">1</span>
        <h2>הזמנות פעילות</h2>
      </div>

      <div class="filters">
        <button>קטגוריה: הכל <span>⌄</span></button>
        <button>מיון: חדש קודם <span>⌄</span></button>
      </div>
    </section>

    <section class="orders">
      <article class="order-card">
        <div class="order-main">          <div class="thumb thumb-one"></div>

          <div class="order-copy">
            <div class="order-topline">
              <div>
                <h3>מבלנץ</h3>
                <p class="item">מברשת</p>
              </div>
              <strong>₪55</strong>
            </div>

            <div class="meta">
              <span class="pill">בגדים</span>
              <span class="divider"></span>
              <span>05.07.26</span>
              <svg viewBox="0 0 24 24"><path d="M7 3.5v3M17 3.5v3M4.5 9h15M6 5h12a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 18 20H6a1.5 1.5 0 0 1-1.5-1.5v-12A1.5 1.5 0 0 1 6 5Z"/></svg>
            </div>

            <p class="tracking">ללא מספר מעקב</p>
          </div>
        </div>

        <div class="order-actions">
          <button class="details">‹ פרטים</button>
          <button class="arrived">הגיע <span>✓</span></button>
        </div>
      </article>

      <article class="order-card">
        <div class="order-main">
          <div class="thumb thumb-two"></div>

          <div class="order-copy">
            <div class="order-topline">
              <div>
                <h3>LILI SHOP</h3>
                <p class="item">תיק קטן</p>
              </div>
              <strong>₪129</strong>
            </div>

            <div class="meta">
              <span class="pill alt">אופנה</span>
              <span class="divider"></span>
              <span>03.07.26</span>
              <svg viewBox="0 0 24 24"><path d="M7 3.5v3M17 3.5v3M4.5 9h15M6 5h12a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 18 20H6a1.5 1.5 0 0 1-1.5-1.5v-12A1.5 1.5 0 0 1 6 5Z"/></svg>
            </div>

            <p class="tracking">ללא מספר מעקב</p>
          </div>
        </div>

        <div class="order-actions">
          <button class="details">‹ פרטים</button>
          <button class="arrived">הגיע <span>✓</span></button>
        </div>
      </article>
    </section>

    <button class="fab">+</button>

    <nav class="bottom-nav">
      <button class="nav-item active nav-open">
        <svg viewBox="0 0 24 24"><path d="M12 3.2 4.9 6.4v11.2l7.1 3.2 7.1-3.2V6.4L12 3.2Z"/><path d="M4.9 6.4 12 9.7l7.1-3.3"/><path d="M12 9.7v11.1"/></svg>
        <span>בדרך</span>
      </button>
      <button class="nav-item nav-done">
        <svg viewBox="0 0 24 24"><path d="M9 12.4 7 10.4 5.9 11.5 9 14.6 17.8 5.8 16.7 4.7 9 12.4Z"/><path d="M5 4.5h14v15H5z"/></svg>
        <span>הגיעו</span>
      </button>
    </nav>
  </main>
</body>
</html>
