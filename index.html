<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf6f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="איפה זה?!" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>איפה זה?!</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
  <div class="app-shell">
    <section id="screen-open" class="screen active" aria-label="בדרך">
      <header class="hero">
        <h1>איפה זה?!</h1>
        <p id="heroSubtitle">0 חבילות בדרך. עכשיו ממש רגוע.</p>
      </header>

      <section class="summary-card">
        <div class="summary-illustration" aria-hidden="true">
          <img src="icon-192.png" alt="" />
        </div>
        <div class="summary-copy">
          <div class="summary-kicker">בדרך עכשיו</div>
          <div id="openSummary" class="summary-main">0 חבילות · ₪0</div>
          <div id="moodLine" class="summary-mood">האשראי נושם לרווחה בינתיים.</div>
        </div>
      </section>

      <label class="search-field">
        <span class="search-icon">⌕</span>
        <input id="openSearch" type="search" placeholder="חפשי חנות, פריט או מספר הזמנה..." autocomplete="off" />
      </label>

      <section class="orders-section">
        <div class="section-title-row with-sort">
          <div class="section-title-main">
            <h2>הזמנות פעילות</h2>
            <span id="openCountBadge" class="count-badge">0</span>
          </div>

          <div class="list-controls">
            <label class="sort-control">
              <span>מיון</span>
              <select id="openSort">
                <option value="newest">חדש קודם</option>
                <option value="oldest">ישן קודם</option>
                <option value="amountHigh">סכום גבוה</option>
                <option value="amountLow">סכום נמוך</option>
                <option value="store">לפי חנות</option>
              </select>
            </label>

            <label class="sort-control category-filter">
              <span>קטגוריה</span>
              <select id="openCategoryFilter"></select>
            </label>
          </div>
        </div>
        <div id="openList" class="open-list"></div>
      </section>

      <button id="quickAddBtn" class="wide-primary-btn" type="button">+ לא לשפוט</button>
    </section>

    <section id="screen-form" class="screen" aria-label="הוספה">
      <header class="sub-header">
        <h2 id="formTitle">הוספת הזמנה</h2>
        <p>רק כדי שלא תשכחי מה הזמנת עכשיו.</p>
      </header>

      <section class="form-card">
        <form id="orderForm" autocomplete="off">
          <input type="hidden" id="editingId" />

          <label class="field">
            <span>תאריך הזמנה</span>
            <input id="date" type="date" required />
          </label>

          <label class="field">
            <span>חנות</span>
            <input id="store" type="text" placeholder="ZARA / iHerb / AliExpress" required />
          </label>

          <label class="field">
            <span>פריט</span>
            <input id="item" type="text" placeholder="מה הזמנת?" required />
          </label>

          <label class="field">
            <span>סכום</span>
            <input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="₪" required />
          </label>

          <label class="field">
            <span>מספר הזמנה / מעקב</span>
            <input id="tracking" type="text" placeholder="לא חובה" />
          </label>

          <label class="field">
            <span>הערה</span>
            <textarea id="note" rows="3" placeholder="משהו שכדאי לזכור?"></textarea>
          </label>

          <fieldset class="category-area">
            <legend>קטגוריה</legend>
            <div id="categoryChips" class="category-grid"></div>
          </fieldset>

          <div class="form-actions">
            <button id="cancelEdit" class="ghost-btn" type="button" hidden>ביטול</button>
            <button class="primary-btn" type="submit">שמרי לי</button>
          </div>
        </form>
      </section>
    </section>

    <section id="screen-done" class="screen" aria-label="הגיעו">
      <header class="sub-header">
        <h2>הגיעו</h2>
        <p id="doneSummary">כאן כל מה שכבר נחת אצלך.</p>
      </header>

      <label class="search-field compact-search">
        <span class="search-icon">⌕</span>
        <input id="doneSearch" type="search" placeholder="חפשי חנות, פריט או מספר הזמנה..." autocomplete="off" />
      </label>

      <div class="section-title-row done-title-row with-sort">
        <div class="section-title-main">
          <h2>כבר אצלי</h2>
          <span id="doneCountBadge" class="count-badge">0</span>
        </div>

        <div class="list-controls">
          <label class="sort-control">
            <span>מיון</span>
            <select id="doneSort">
              <option value="arrivedRecent">הגיעו לאחרונה</option>
              <option value="oldest">הזמנות ישנות</option>
              <option value="amountHigh">סכום גבוה</option>
              <option value="amountLow">סכום נמוך</option>
              <option value="store">לפי חנות</option>
            </select>
          </label>

          <label class="sort-control category-filter">
            <span>קטגוריה</span>
            <select id="doneCategoryFilter"></select>
          </label>
        </div>
      </div>
      <div id="doneList" class="done-grid"></div>

      <section class="tools-card">
        <div class="tools-head">
          <h3>גיבוי ושחזור</h3>
          <p>שקט בצד, רק למקרה שהאייפון שוב מחליט להיות אייפון.</p>
        </div>
        <div id="backupMount"></div>
      </section>
    </section>

    <nav class="bottom-nav" aria-label="ניווט">
      <button class="nav-btn active" data-screen="open" type="button">
        <span class="nav-icon">⌂</span>
        <span class="nav-label">בדרך</span>
      </button>
      <button class="nav-btn nav-add" data-screen="form" type="button">
        <span class="nav-icon">＋</span>
        <span class="nav-label">הוספה</span>
      </button>
      <button class="nav-btn" data-screen="done" type="button">
        <span class="nav-icon">☑</span>
        <span class="nav-label">הגיעו</span>
      </button>
    </nav>
  </div>

  <dialog id="detailsDialog" class="details-dialog">
    <div class="details-panel">
      <button id="closeDetails" class="dialog-close" type="button" aria-label="סגירה">×</button>
      <div id="detailsContent"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
