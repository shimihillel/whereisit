<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f5ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="איפה זה?!" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>איפה זה?!</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
  <div class="app-shell">
    <header class="brand-header">
      <h1>איפה זה?!</h1>
      <p id="heroLine">אין מה לומר. הכל בדרך או בראש.</p>
    </header>

    <main>
      <section id="screen-open" class="screen active" aria-label="בדרך">
        <div class="summary-card">
          <div class="summary-copy">
            <div class="summary-kicker">בדרך עכשיו</div>
            <div id="openSummary" class="summary-title">יש לך 0 חבילות בדרך</div>
            <div class="summary-inline-stats">
              <span><b id="statOpen">0</b> חבילות</span>
              <span class="divider">•</span>
              <span><b id="statAmount">₪0</b></span>
            </div>
            <div id="moodLine" class="summary-mood">הדואר עובד בשבילך היום.</div>
            <div class="summary-secondary">כבר אצלי: <b id="statDone">0</b></div>
          </div>
          <div class="summary-sticker" aria-hidden="true">📦</div>
        </div>

        <label class="search-box">
          <input id="openSearch" type="search" placeholder="חפשי חנות, פריט או מספר הזמנה..." autocomplete="off" />
          <span>⌕</span>
        </label>

        <div class="section-row">
          <div class="section-title">
            <span id="openBadge" class="section-badge">0</span>
            <h2>הזמנות פעילות</h2>
          </div>
        </div>

        <div id="openList" class="open-list"></div>

        <button id="addWide" class="wide-add" type="button">+ לא לשפוט</button>
      </section>

      <section id="screen-form" class="screen" aria-label="הוספה">
        <div class="panel-card">
          <div class="panel-head">
            <h2 id="formTitle">הוספת הזמנה</h2>
            <button id="cancelEdit" class="ghost-btn" type="button" hidden>ביטול</button>
          </div>

          <form id="orderForm" autocomplete="off">
            <input type="hidden" id="editingId" />

            <label class="field"><span>תאריך</span><input id="date" type="date" required /></label>
            <label class="field"><span>חנות</span><input id="store" type="text" placeholder="ZARA / iHerb / AliExpress" required /></label>
            <label class="field"><span>פריט</span><input id="item" type="text" placeholder="מה הזמנת הפעם?" required /></label>
            <label class="field"><span>סכום</span><input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="₪" required /></label>
            <label class="field"><span>מספר הזמנה / מעקב</span><input id="tracking" type="text" placeholder="לא חובה, אבל מועיל" /></label>
            <label class="field"><span>הערה</span><textarea id="note" rows="2" placeholder="משהו לזכור?"></textarea></label>

            <fieldset class="categories">
              <legend>קטגוריה</legend>
              <div id="categoryChips" class="chip-grid"></div>
            </fieldset>

            <button class="save-btn" type="submit">שמרי לי</button>
          </form>
        </div>
      </section>

      <section id="screen-done" class="screen" aria-label="הגיעו">
        <div class="panel-card history-head">
          <div class="section-title">
            <span id="doneBadge" class="section-badge">0</span>
            <h2>הגיעו</h2>
          </div>
          <p id="doneSummary">מצאת משהו מהעבר?</p>
          <label class="search-box compact-search">
            <input id="doneSearch" type="search" placeholder="חפשי חנות, פריט או מספר הזמנה..." autocomplete="off" />
            <span>⌕</span>
          </label>
        </div>

        <div id="doneList" class="done-grid"></div>

        <div class="data-tools panel-card">
          <div class="data-tools-head">
            <h3>גיבוי ושחזור</h3>
            <p>רק כדי לישון בשקט.</p>
          </div>
          <div id="backupMount"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="ניווט">
      <button class="nav-btn active" data-screen="open" type="button"><span>⌂</span>בדרך</button>
      <button class="nav-btn nav-add" data-screen="form" type="button"><span>＋</span>הוספה</button>
      <button class="nav-btn" data-screen="done" type="button"><span>☑</span>הגיעו</button>
    </nav>
  </div>

  <dialog id="detailsDialog" class="details-dialog">
    <div class="dialog-card">
      <button id="closeDetails" class="dialog-close" type="button" aria-label="סגירה">×</button>
      <div id="detailsContent"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
