<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff2da1" />
  <title>איפה זה?!</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="tape tape-top">האפליקציה שלא שופטת.</div>
      <h1>איפה זה?!</h1>
      <p class="tagline">רק מחכה איתך לחבילות.</p>
      <div class="doodle doodle-heart">♡</div>
      <div class="doodle doodle-q">?!</div>
    </header>

    <main>
      <section id="screen-open" class="screen active" aria-label="הזמנות בדרך">
        <div class="summary-card sticker-yellow">
          <p class="summary-line" id="openSummary">בדרך אלייך עכשיו: 0 חבילות · ₪0</p>
          <p class="mood-line" id="moodLine">אין כלום בדרך. חשוד מאוד.</p>
        </div>

        <div class="toolbar">
          <label class="search-wrap">
            <span>🔎</span>
            <input id="openSearch" type="search" placeholder="חפשי חנות, פריט או מספר הזמנה" autocomplete="off" />
          </label>
        </div>

        <div id="openList" class="order-list"></div>
      </section>

      <section id="screen-form" class="screen" aria-label="הוספת הזמנה">
        <div class="form-card paper-card">
          <div class="form-head">
            <button class="tiny-button" id="cancelEdit" type="button" hidden>ביטול עריכה</button>
            <h2 id="formTitle">הוספת הזמנה</h2>
          </div>

          <form id="orderForm" autocomplete="off">
            <input type="hidden" id="editingId" />

            <label class="field">
              <span>📅 תאריך</span>
              <input id="date" type="date" required />
            </label>

            <label class="field">
              <span>🏪 חנות</span>
              <input id="store" type="text" placeholder="ZARA / iHerb / AliExpress" required />
            </label>

            <label class="field">
              <span>📦 פריט</span>
              <input id="item" type="text" placeholder="מה הזמנת הפעם?" required />
            </label>

            <label class="field">
              <span>🏷️ סכום</span>
              <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="₪" required />
            </label>

            <label class="field">
              <span>🧾 מספר הזמנה / מעקב</span>
              <input id="tracking" type="text" placeholder="לא חובה, אבל עושה סדר בראש" />
            </label>

            <label class="field">
              <span>💬 הערה</span>
              <textarea id="note" rows="2" placeholder="מתנה לניר / קניתי כי היה במבצע / לא לשאול"></textarea>
            </label>

            <fieldset class="categories">
              <legend>קטגוריה</legend>
              <div id="categoryChips" class="chip-grid"></div>
            </fieldset>

            <button class="save-button" type="submit">שמרי לי</button>
          </form>
        </div>
      </section>

      <section id="screen-done" class="screen" aria-label="היסטוריה">
        <div class="history-head paper-card small-paper">
          <h2>כבר אצלי</h2>
          <p>מצאת משהו מהעבר?</p>
          <label class="search-wrap">
            <span>🔎</span>
            <input id="doneSearch" type="search" placeholder="חפשי חנות, פריט או מספר הזמנה" autocomplete="off" />
          </label>
        </div>

        <div id="doneList" class="order-list history-list"></div>
      </section>
    </main>

    <button id="addFab" class="fab" type="button">+ לא לשפוט</button>

    <nav class="bottom-nav" aria-label="ניווט">
      <button class="nav-btn active" data-screen="open" type="button">בדרך</button>
      <button class="nav-btn" data-screen="form" type="button">הוספה</button>
      <button class="nav-btn" data-screen="done" type="button">כבר אצלי</button>
    </nav>
  </div>

  <template id="emptyTemplate">
    <div class="empty-state">
      <div class="empty-sticker">📭</div>
      <h3></h3>
      <p></p>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
